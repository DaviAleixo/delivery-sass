<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redefinir sua senha - PedeMuleke</title>
  </head>
  <body style="margin:0;padding:0;background-color:#eef2f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#eef2f0;padding:36px 16px;">
      <tr>
        <td align="center">
          <!-- Card principal -->
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:520px;background-color:#ffffff;border-radius:20px;overflow:hidden;border:1px solid #e2e8f0;box-shadow:0 12px 32px rgba(15,23,42,0.08);">
            <!-- Faixa decorativa verde superior -->
            <tr>
              <td style="height:8px;background:linear-gradient(90deg,#22c55e 0%,#16a34a 50%,#047857 100%);font-size:0;line-height:0;">&nbsp;</td>
            </tr>

            <!-- Conteúdo -->
            <tr>
              <td align="center" style="padding:36px 32px 32px 32px;">
                <!-- Logo PedeMuleke (substitua pela URL pública HTTPS da sua logo) -->
                <img
                  src="https://SEU-DOMINIO.com/imgs/logo-painel.png"
                  alt="PedeMuleke"
                  width="210"
                  style="display:block;max-width:210px;width:100%;height:auto;margin:0 auto 22px auto;border:0;font-size:26px;font-weight:900;color:#065f46;text-align:center;"
                />

                <!-- Título -->
                <h1 style="margin:0 0 12px 0;font-size:28px;line-height:1.2;font-weight:800;color:#065f46;letter-spacing:-0.02em;">
                  Redefinir sua senha
                </h1>

                <!-- Texto -->
                <p style="margin:0 0 28px 0;font-size:15px;line-height:1.55;color:#4b5563;max-width:380px;">
                  Recebemos uma solicitação para redefinir a senha de acesso ao seu painel.
                </p>

                <!-- Botão CTA -->
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin:0 auto 26px auto;">
                  <tr>
                    <td align="center" bgcolor="#047857" style="border-radius:12px;background:linear-gradient(90deg,#16a34a 0%,#047857 100%);">
                      <a
                        href="{{ .ConfirmationURL }}"
                        target="_blank"
                        style="display:inline-block;padding:14px 32px;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:12px;"
                      >
                        Criar nova senha &rarr;
                      </a>
                    </td>
                  </tr>
                </table>

                <!-- Aviso de segurança -->
                <p style="margin:0;font-size:12px;line-height:1.5;color:#6b7280;">
                  Se você não solicitou essa alteração, pode ignorar este e-mail com segurança.
                </p>
              </td>
            </tr>

            <!-- Rodapé suave -->
            <tr>
              <td align="center" style="padding:16px 24px;background-color:#f8faf9;border-top:1px solid #eef2f0;">
                <p style="margin:0;font-size:11px;color:#9ca3af;">
                  PedeMuleke &bull; Portal de Gestão &amp; Cardápio Digital
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
